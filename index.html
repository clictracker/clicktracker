<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ClicTracker</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --background: #05070b;
      --surface: #0d111a;
      --surface-hover: #121827;
      --border: #222938;
      --text: #ffffff;
      --text-secondary: #8d96a8;
      --blue: #2563eb;
    }

    html {
      min-height: 100%;
      background: var(--background);
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(
          circle at 50% 0%,
          rgba(37, 99, 235, 0.10),
          transparent 35%
        ),
        var(--background);

      color: var(--text);
    }

    .container {
      width: 100%;
      max-width: 520px;
      margin: auto;
      padding: 24px 20px 45px;
    }

    /* HEADER */

    .top-bar {
      width: 100%;
      display: flex;
      justify-content: flex-end;
      margin-bottom: 45px;
    }

    .clictracker-logo {
      width: 115px;
      height: auto;
      object-fit: contain;
    }

    /* INFORMACIÓN DEL NEGOCIO */

    .business-info {
      text-align: center;
      margin-bottom: 38px;
    }

    .business-logo {
      width: 95px;
      height: 95px;

      margin: 0 auto 20px;

      border-radius: 50%;

      background: #151b27;
      border: 1px solid var(--border);

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;
    }

    .business-logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .business-info h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 10px;
      letter-spacing: -0.5px;
    }

    .business-info p {
      color: var(--text-secondary);
      font-size: 15px;
      line-height: 1.6;
    }

    /* BOTONES */

    .links {
      display: flex;
      flex-direction: column;
      gap: 13px;
    }

    .link-button {
      width: 100%;
      min-height: 68px;

      display: flex;
      align-items: center;

      padding: 14px 18px;

      text-decoration: none;
      color: var(--text);

      background: var(--surface);

      border: 1px solid var(--border);
      border-radius: 17px;

      transition:
        transform 0.2s ease,
        background 0.2s ease,
        border 0.2s ease;
    }

    .link-button:hover {
      transform: translateY(-2px);
      background: var(--surface-hover);
      border-color: #334155;
    }

    .link-button:active {
      transform: scale(0.98);
    }

    .icon {
      width: 42px;
      height: 42px;

      display: flex;
      align-items: center;
      justify-content: center;

      margin-right: 12px;

      border-radius: 12px;

      background: rgba(255, 255, 255, 0.04);

      font-size: 22px;
    }

    .link-text {
      flex: 1;

      text-align: left;

      font-size: 16px;
      font-weight: 600;
    }

    .arrow {
      font-size: 24px;
      color: #64748b;
    }

    /* UBICACIÓN */

    .location {
      margin-top: 42px;
    }

    .location-title {
      display: flex;
      align-items: center;
      gap: 8px;

      margin-bottom: 15px;

      font-size: 17px;
      font-weight: 600;
    }

    .location-title span {
      color: var(--blue);
    }

    .map-container {
      width: 100%;
      height: 260px;

      overflow: hidden;

      border-radius: 18px;

      border: 1px solid var(--border);

      background: var(--surface);
    }

    .map-container iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* FOOTER */

    footer {
      text-align: center;

      margin-top: 42px;

      font-size: 12px;

      color: #5f6878;
    }

    footer strong {
      color: #8baeff;
    }

    /* RESPONSIVE */

    @media (max-width: 480px) {

      .container {
        padding: 20px 16px 40px;
      }

      .top-bar {
        margin-bottom: 35px;
      }

      .clictracker-logo {
        width: 105px;
      }

      .business-info h1 {
        font-size: 25px;
      }

      .link-button {
        min-height: 64px;
      }

      .map-container {
        height: 230px;
      }

    }

  </style>
</head>

<body>

  <main class="container">

    <!-- LOGO CLICTRACKER ARRIBA A LA DERECHA -->

    <header class="top-bar">

      <img
        src="logoclicktracker.png"
        alt="ClicTracker"
        class="clictracker-logo"
      >

    </header>


    <!-- INFORMACIÓN DEL NEGOCIO -->

    <section class="business-info">

      <div class="business-logo">

        <!--
          AQUÍ IRÁ EL LOGO DEL NEGOCIO.
          MÁS ADELANTE LO CARGAREMOS DESDE SUPABASE.
        -->

        <span style="font-size: 35px;">🏪</span>

      </div>

      <h1>Nombre del negocio</h1>

      <p>
        Todo lo que necesitas,<br>
        en un solo lugar.
      </p>

    </section>


    <!-- ENLACES -->

    <section class="links">

      <a
        href="#"
        class="link-button"
        data-action="google_review"
      >

        <div class="icon">⭐</div>

        <div class="link-text">
          Déjanos una reseña en Google
        </div>

        <div class="arrow">›</div>

      </a>


      <a
        href="#"
        class="link-button"
        data-action="instagram"
      >

        <div class="icon">📸</div>

        <div class="link-text">
          Síguenos en Instagram
        </div>

        <div class="arrow">›</div>

      </a>


      <a
        href="#"
        class="link-button"
        data-action="facebook"
      >

        <div class="icon">👍</div>

        <div class="link-text">
          Síguenos en Facebook
        </div>

        <div class="arrow">›</div>

      </a>


      <a
        href="#"
        class="link-button"
        data-action="website"
      >

        <div class="icon">🌐</div>

        <div class="link-text">
          Visita nuestra página web
        </div>

        <div class="arrow">›</div>

      </a>


      <a
        href="#"
        class="link-button"
        data-action="whatsapp"
      >

        <div class="icon">💬</div>

        <div class="link-text">
          Escríbenos por WhatsApp
        </div>

        <div class="arrow">›</div>

      </a>

    </section>


    <!-- MAPA -->

    <section class="location">

      <div class="location-title">

        <span>📍</span>

        <div>Encuéntranos</div>

      </div>

      <div class="map-container">

        <iframe
          src="https://www.google.com/maps?q=Miraflores,Lima,Peru&output=embed"
          loading="lazy"
          allowfullscreen>
        </iframe>

      </div>

    </section>


    <!-- FOOTER -->

    <footer>
      Powered by <strong>ClicTracker</strong>
    </footer>

  </main>

</body>
</html>
