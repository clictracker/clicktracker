<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ClicTracker</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f7f8fa;
            color: #111827;
        }

        .container {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            padding: 35px 20px 30px;
        }

        /* LOGO */

        .logo-container {
            text-align: center;
            margin-bottom: 18px;
        }

        .logo {
            width: 90px;
            height: 90px;
            object-fit: contain;
            border-radius: 50%;
        }

        /* NEGOCIO */

        .business-name {
            text-align: center;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .business-description {
            text-align: center;
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 30px;
        }

        /* BOTONES */

        .links {
            display: flex;
            flex-direction: column;
            gap: 13px;
        }

        .link-button {
            width: 100%;
            min-height: 58px;

            display: flex;
            align-items: center;
            justify-content: center;

            position: relative;

            padding: 15px 50px;

            border: none;
            border-radius: 14px;

            background: white;
            color: #111827;

            text-decoration: none;

            font-size: 16px;
            font-weight: 600;

            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);

            transition: 0.2s ease;
        }

        .link-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.10);
        }

        .icon {
            position: absolute;
            left: 20px;

            width: 24px;
            height: 24px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 20px;
        }

        /* MAPA */

        .map-title {
            text-align: center;
            margin-top: 35px;
            margin-bottom: 12px;

            font-size: 18px;
            font-weight: 700;
        }

        .map-container {
            width: 100%;
            height: 280px;

            overflow: hidden;

            border-radius: 16px;

            background: #e5e7eb;

            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .map-container iframe {
            width: 100%;
            height: 100%;

            border: 0;
        }

        /* FOOTER */

        .footer {
            text-align: center;
            margin-top: 30px;

            font-size: 12px;
            color: #9ca3af;
        }

        .footer strong {
            color: #6b7280;
        }

        /* MOBILE */

        @media (max-width: 400px) {

            .container {
                padding: 25px 15px;
            }

            .business-name {
                font-size: 22px;
            }

            .link-button {
                min-height: 55px;
            }

        }
    </style>
</head>

<body>

<div class="container">

    <!-- LOGO -->

    <div class="logo-container">

        <img
            src="https://via.placeholder.com/180"
            alt="Logo del negocio"
            class="logo"
        >

    </div>


    <!-- INFORMACIÓN DEL NEGOCIO -->

    <h1 class="business-name">
        Restaurante XYZ
    </h1>

    <p class="business-description">
        ¡Gracias por visitarnos!
    </p>


    <!-- ENLACES -->

    <div class="links">

        <!-- GOOGLE -->

        <a
            href="https://www.google.com"
            class="link-button"
            target="_blank"
        >

            <span class="icon">⭐</span>

            Google Reviews

        </a>


        <!-- INSTAGRAM -->

        <a
            href="https://www.instagram.com"
            class="link-button"
            target="_blank"
        >

            <span class="icon">◎</span>

            Instagram

        </a>


        <!-- FACEBOOK -->

        <a
            href="https://www.facebook.com"
            class="link-button"
            target="_blank"
        >

            <span class="icon">f</span>

            Facebook

        </a>


        <!-- PAGINA WEB -->

        <a
            href="https://www.google.com"
            class="link-button"
            target="_blank"
        >

            <span class="icon">🌐</span>

            Página web

        </a>

    </div>


    <!-- MAPA -->

    <h2 class="map-title">
        📍 Encuéntranos
    </h2>

    <div class="map-container">

        <iframe
            src="https://www.google.com/maps?q=Miraflores,Lima,Peru&output=embed"
            loading="lazy"
            allowfullscreen
        >
        </iframe>

    </div>


    <!-- FOOTER -->

    <div class="footer">

        Powered by <strong>ClicTracker</strong>

    </div>

</div>

</body>
</html>
