<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ClicTracker</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #090b10;
      --card: #131720;
      --card-hover: #1a1f2a;
      --border: #262c38;
      --text: #ffffff;
      --muted: #8d96a5;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(
          circle at top,
          #151a24 0%,
          #090b10 55%
        );
      color: var(--text);
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 600px;
      margin: auto;
      padding: 22px 18px 40px;
    }

    /* LOGO */

    .top {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 35px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
    }

    .brand-icon {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      background: #ffffff;
      color: #090b10;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 900;
    }

    /* BUSINESS HEADER */

    .business-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .business-logo {
      width: 82px;
      height: 82px;
      border-radius: 22px;
      object-fit: cover;
      border: 1px solid var(--border);
      margin-bottom: 16px;
      display: none;
    }

    .business-placeholder {
      width: 82px;
      height: 82px;
      border-radius: 22px;
      background: #1b202a;
      border: 1px solid var(--border);
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
    }

    .business-name {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 9px;
    }

    .business-description {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
      max-width: 440px;
      margin: auto;
    }

    /* BUTTONS */

    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link-button {
      width: 100%;
      min-height: 62px;

      display: flex;
      align-items: center;

      background: var(--card);
      border: 1px solid var(--border);

      border-radius: 16px;

      color: var(--text);
      text-decoration: none;

      padding: 0 18px;

      transition:
        transform .15s ease,
        background .15s ease;
    }

    .link-button:hover {
      background: var(--card-hover);
      transform: translateY(-2px);
    }

    .link-icon {
      width: 38px;
      height: 38px;

      border-radius: 11px;

      background: #222835;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 18px;

      margin-right: 14px;
    }

    .link-content {
      flex: 1;
      text-align: left;
    }

    .link-title {
      font-size: 15px;
      font-weight: 700;
    }

    .link-subtitle {
      font-size: 12px;
      color: var(--muted);
      margin-top: 3px;
    }

    .arrow {
      color: var(--muted);
      font-size: 20px;
    }

    /* MAP */

    .map-section {
      margin-top: 32px;
      display: none;
    }

    .section-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .map-container {
      overflow: hidden;
      border-radius: 18px;
      border: 1px solid var(--border);
      background: var(--card);
      height: 280px;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* FOOTER */

    .footer {
      text-align: center;
      color: #5f6774;
      font-size: 11px;
      margin-top: 35px;
    }

    /* LOADING */

    #loading {
      min-height: 100vh;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      gap: 15px;

      color: var(--muted);
    }

    .loader {
      width: 35px;
      height: 35px;

      border: 3px solid #252b36;
      border-top-color: white;

      border-radius: 50%;

      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ERROR */

    #errorScreen {
      min-height: 100vh;

      display: none;

      align-items: center;
      justify-content: center;

      padding: 25px;
      text-align: center;
    }

    .error-box {
      max-width: 400px;
    }

    .error-icon {
      font-size: 45px;
      margin-bottom: 15px;
    }

    .error-box h1 {
      margin-bottom: 10px;
    }

    .error-box p {
      color: var(--muted);
      line-height: 1.5;
    }

    /* MAIN */

    #mainContent {
      display: none;
    }

  </style>
</head>


<body>


  <!-- LOADING -->

  <div id="loading">

    <div class="loader"></div>

    <div>
      Cargando información...
    </div>

  </div>


  <!-- ERROR -->

  <div id="errorScreen">

    <div class="error-box">

      <div class="error-icon">
        ⚠️
      </div>

      <h1>NFC no encontrado</h1>

      <p>
        Esta tarjeta no está registrada o ya no se encuentra activa.
      </p>

    </div>

  </div>


  <!-- MAIN -->

  <main id="mainContent">

    <div class="container">


      <!-- BRAND -->

      <div class="top">

        <div class="brand">

          <div class="brand-icon">
            CT
          </div>

          ClicTracker

        </div>

      </div>


      <!-- BUSINESS -->

      <section class="business-header">

        <img
          id="businessLogo"
          class="business-logo"
          alt="Logo del negocio"
        >

        <div
          id="businessPlaceholder"
          class="business-placeholder"
        >
          🏢
        </div>


        <h1
          id="businessName"
          class="business-name"
        >
        </h1>


        <p
          id="businessDescription"
          class="business-description"
        >
        </p>

      </section>


      <!-- LINKS -->

      <section
        class="links"
        id="linksContainer"
      >
      </section>


      <!-- MAP -->

      <section
        class="map-section"
        id="mapSection"
      >

        <h2 class="section-title">
          📍 Encuéntranos aquí
        </h2>

        <div class="map-container">

          <iframe
            id="businessMap"
            loading="lazy"
            allowfullscreen
          >
          </iframe>

        </div>

      </section>


      <div class="footer">
        Powered by ClicTracker
      </div>


    </div>

  </main>


  <script>

    /* =========================================
       SUPABASE
    ========================================= */

    const SUPABASE_URL =
      "https://zrbujdpmrgeotubirxip.supabase.co";

    const SUPABASE_ANON_KEY =
      "sb_publishable_nH8fy-c0R_JQ_RHFpOY-kg_2gJW01mD";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );


    /* =========================================
       VARIABLES
    ========================================= */

    let currentBusiness = null;

    let currentNfc = null;


    /* =========================================
       INICIAR
    ========================================= */

    document.addEventListener(
      "DOMContentLoaded",
      loadBusiness
    );


    /* =========================================
       CARGAR NEGOCIO DESDE NFC
    ========================================= */

    async function loadBusiness() {

      const params =
        new URLSearchParams(
          window.location.search
        );


      const nfcCode =
        params.get("nfc");


      if (!nfcCode) {

        showError();

        return;

      }


      /*
        Buscamos la tarjeta NFC
        y el negocio relacionado.
      */

      const {
        data,
        error
      } =
      await supabaseClient
        .from("nfc_devices")
        .select(`
          *,
          businesses (
            *
          )
        `)
        .eq("code", nfcCode)
        .eq("status", "active")
        .maybeSingle();


      if (
        error ||
        !data ||
        !data.businesses
      ) {

        console.error(error);

        showError();

        return;

      }


      currentNfc = data;

      currentBusiness =
        data.businesses;


      /*
        Verificamos que
        el negocio esté activo.
      */

      if (
        currentBusiness.status !==
        "active"
      ) {

        showError();

        return;

      }


      renderBusiness();

    }


    /* =========================================
       RENDER NEGOCIO
    ========================================= */

    function renderBusiness() {

      document.title =
        currentBusiness.name +
        " | ClicTracker";


      document
        .getElementById("businessName")
        .textContent =
          currentBusiness.name;


      /*
        Descripción
      */

      const description =
        document.getElementById(
          "businessDescription"
        );


      if (
        currentBusiness.description
      ) {

        description.textContent =
          currentBusiness.description;

      } else {

        description.style.display =
          "none";

      }


      /*
        Logo
      */

      const logo =
        document.getElementById(
          "businessLogo"
        );

      const placeholder =
        document.getElementById(
          "businessPlaceholder"
        );


      if (
        currentBusiness.logo_url
      ) {

        logo.src =
          currentBusiness.logo_url;

        logo.style.display =
          "block";

        placeholder.style.display =
          "none";

      }


      /*
        LINKS
      */

      renderLinks();


      /*
        MAPA
      */

      if (
        currentBusiness.maps_embed_url
      ) {

        document
          .getElementById("businessMap")
          .src =
            currentBusiness.maps_embed_url;


        document
          .getElementById("mapSection")
          .style.display =
            "block";

      }


      /*
        Mostrar página
      */

      document
        .getElementById("loading")
        .style.display =
          "none";


      document
        .getElementById("mainContent")
        .style.display =
          "block";

    }


    /* =========================================
       CREAR LINKS DINÁMICAMENTE
    ========================================= */

    function renderLinks() {

      const container =
        document.getElementById(
          "linksContainer"
        );


      container.innerHTML = "";


      /*
        GOOGLE REVIEWS
      */

      if (
        currentBusiness.google_review_url
      ) {

        addLink(
          "⭐",
          "Google Reviews",
          "Déjanos tu opinión",
          currentBusiness.google_review_url,
          "google_review"
        );

      }


      /*
        INSTAGRAM
      */

      if (
        currentBusiness.instagram_url
      ) {

        addLink(
          "📸",
          "Instagram",
          "Síguenos en Instagram",
          currentBusiness.instagram_url,
          "instagram"
        );

      }


      /*
        FACEBOOK
      */

      if (
        currentBusiness.facebook_url
      ) {

        addLink(
          "📘",
          "Facebook",
          "Síguenos en Facebook",
          currentBusiness.facebook_url,
          "facebook"
        );

      }


      /*
        WEBSITE
      */

      if (
        currentBusiness.website_url
      ) {

        addLink(
          "🌐",
          "Página web",
          "Visita nuestra web",
          currentBusiness.website_url,
          "website"
        );

      }


      /*
        WHATSAPP
      */

      if (
        currentBusiness.whatsapp
      ) {

        let whatsappUrl =
          currentBusiness.whatsapp;


        /*
          Si solamente pusiste
          el número:
          51999999999
        */

        if (
          !whatsappUrl.startsWith(
            "http"
          )
        ) {

          whatsappUrl =
            "https://wa.me/" +
            whatsappUrl
              .replace(/\D/g, "");

        }


        addLink(
          "💬",
          "WhatsApp",
          "Escríbenos directamente",
          whatsappUrl,
          "whatsapp"
        );

      }

    }


    /* =========================================
       AGREGAR BOTÓN
    ========================================= */

    function addLink(
      icon,
      title,
      subtitle,
      url,
      action
    ) {

      const container =
        document.getElementById(
          "linksContainer"
        );


      const link =
        document.createElement("a");


      link.href = url;

      link.target = "_blank";

      link.rel =
        "noopener noreferrer";


      link.className =
        "link-button";


      link.innerHTML = `

        <div class="link-icon">
          ${icon}
        </div>

        <div class="link-content">

          <div class="link-title">
            ${title}
          </div>

          <div class="link-subtitle">
            ${subtitle}
          </div>

        </div>

        <div class="arrow">
          ›
        </div>

      `;


      /*
        TRACKING DEL CLICK
      */

      link.addEventListener(
        "click",
        function() {

          trackClick(action);

        }
      );


      container.appendChild(link);

    }


    /* =========================================
       TRACKING
    ========================================= */

    async function trackClick(action) {

      if (
        !currentBusiness ||
        !currentNfc
      ) return;


      /*
        Insertamos el click
        en Supabase.
      */

      const {
        error
      } =
      await supabaseClient
        .from("clicks")
        .insert({

          business_id:
            currentBusiness.id,

          nfc_id:
            currentNfc.id,

          action:
            action

        });


      if (error) {

        /*
          No bloqueamos al usuario.
          Si falla el tracking,
          igual podrá abrir el link.
        */

        console.error(
          "Error tracking click:",
          error
        );

      }

    }


    /* =========================================
       ERROR
    ========================================= */

    function showError() {

      document
        .getElementById("loading")
        .style.display =
          "none";


      document
        .getElementById("errorScreen")
        .style.display =
          "flex";

    }

  </script>

</body>
</html>
