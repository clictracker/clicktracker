<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ClickTracker</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #080b12;
      --bg-soft: #0d111a;
      --card: #111722;
      --border: rgba(255,255,255,0.08);
      --text: #f5f7fb;
      --muted: #929aaa;
      --blue: #2563eb;
      --blue-light: #3b82f6;
    }

    body {
      min-height: 100vh;
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background:
        radial-gradient(
          circle at 50% 0%,
          rgba(37, 99, 235, 0.12),
          transparent 35%
        ),
        var(--bg);

      color: var(--text);
    }

    /* =========================
       LOADING
    ========================= */

    #loading {
      min-height: 100vh;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      gap: 16px;

      color: var(--muted);
    }

    .loader {
      width: 38px;
      height: 38px;

      border-radius: 50%;

      border: 3px solid rgba(255,255,255,0.08);
      border-top-color: var(--blue-light);

      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* =========================
       APP
    ========================= */

    #app {
      display: none;
      min-height: 100vh;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      height: 76px;

      display: flex;
      align-items: center;
      justify-content: flex-end;

      padding: 0 28px;

      border-bottom: 1px solid var(--border);

      background: rgba(8,11,18,0.8);

      backdrop-filter: blur(14px);

      position: sticky;
      top: 0;
      z-index: 10;
    }

    .clicktracker-brand {
      display: flex;
      align-items: center;
      gap: 10px;

      font-weight: 700;
      font-size: 17px;

      letter-spacing: -0.4px;
    }

    .ct-icon {
      width: 38px;
      height: 38px;

      border-radius: 12px;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        linear-gradient(
          135deg,
          #2563eb,
          #1d4ed8
        );

      box-shadow:
        0 0 25px
        rgba(37,99,235,0.35);

      font-size: 17px;
      font-weight: 800;

      color: white;
    }

    /* =========================
       MAIN
    ========================= */

    main {
      width: 100%;
      max-width: 650px;

      margin: 0 auto;

      padding:
        52px
        20px
        60px;
    }

    /* =========================
       BUSINESS HEADER
    ========================= */

    .business-header {
      text-align: center;

      margin-bottom: 38px;
    }

    .business-logo {
      width: 100px;
      height: 100px;

      border-radius: 26px;

      object-fit: cover;

      margin-bottom: 18px;

      background: var(--card);

      border: 1px solid var(--border);

      box-shadow:
        0 15px 45px
        rgba(0,0,0,0.35);
    }

    .business-logo-placeholder {
      width: 100px;
      height: 100px;

      margin:
        0 auto
        18px;

      border-radius: 26px;

      display: flex;

      align-items: center;
      justify-content: center;

      background:
        linear-gradient(
          135deg,
          #172033,
          #0f1726
        );

      border: 1px solid var(--border);

      font-size: 38px;
      font-weight: 800;

      color: var(--blue-light);
    }

    .business-name {
      font-size: 30px;

      font-weight: 750;

      letter-spacing: -1px;

      margin-bottom: 8px;
    }

    .business-description {
      color: var(--muted);

      font-size: 15px;

      line-height: 1.6;

      max-width: 430px;

      margin: 0 auto;
    }

    /* =========================
       BUTTONS
    ========================= */

    .links {
      display: flex;

      flex-direction: column;

      gap: 14px;
    }

    .link-button {
      width: 100%;

      min-height: 68px;

      display: flex;

      align-items: center;

      padding: 10px 20px;

      border-radius: 18px;

      border: 1px solid var(--border);

      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,0.08),
          rgba(255,255,255,0.035)
        );

      color: var(--text);

      text-decoration: none;

      cursor: pointer;

      transition:
        transform 0.18s ease,
        border-color 0.18s ease,
        background 0.18s ease,
        box-shadow 0.18s ease;
    }

    .link-button:hover {
      transform: translateY(-2px);

      border-color:
        rgba(59,130,246,0.55);

      background:
        linear-gradient(
          135deg,
          rgba(37,99,235,0.20),
          rgba(255,255,255,0.05)
        );

      box-shadow:
        0 12px 35px
        rgba(0,0,0,0.28);
    }

    .link-button:active {
      transform: scale(0.985);
    }

    .button-icon {
      width: 42px;
      height: 42px;

      flex-shrink: 0;

      display: flex;

      align-items: center;
      justify-content: center;

      border-radius: 12px;

      background:
        rgba(255,255,255,0.06);

      font-size: 21px;
    }

    .button-content {
      flex: 1;

      text-align: center;

      font-size: 16px;

      font-weight: 600;

      padding-right: 42px;
    }

    .button-arrow {
      color: var(--muted);

      font-size: 21px;
    }

    /* GOOGLE REVIEW DESTACADO */

    .google-review {
      background:
        linear-gradient(
          135deg,
          #1d4ed8,
          #2563eb
        );

      border-color:
        rgba(96,165,250,0.6);

      box-shadow:
        0 12px 35px
        rgba(37,99,235,0.25);
    }

    .google-review:hover {
      background:
        linear-gradient(
          135deg,
          #2563eb,
          #3b82f6
        );
    }

    .google-review .button-icon {
      background:
        rgba(255,255,255,0.16);
    }

    .google-review .button-arrow {
      color: white;
    }

    /* =========================
       MAP
    ========================= */

    .map-section {
      margin-top: 42px;
    }

    .map-title {
      font-size: 17px;

      font-weight: 650;

      margin-bottom: 14px;

      color: var(--text);
    }

    .map-container {
      width: 100%;

      height: 300px;

      overflow: hidden;

      border-radius: 20px;

      border: 1px solid var(--border);

      background: var(--card);
    }

    .map-container iframe {
      width: 100%;
      height: 100%;

      border: 0;
    }

    /* =========================
       FOOTER
    ========================= */

    footer {
      text-align: center;

      color: #667085;

      font-size: 13px;

      padding-top: 40px;
    }

    .powered {
      display: inline-flex;

      align-items: center;

      gap: 7px;
    }

    .powered-icon {
      width: 20px;
      height: 20px;

      border-radius: 7px;

      display: inline-flex;

      align-items: center;
      justify-content: center;

      background:
        rgba(37,99,235,0.2);

      color: var(--blue-light);

      font-size: 10px;

      font-weight: 800;
    }

    /* =========================
       ERROR
    ========================= */

    #error-page {
      display: none;

      min-height: 100vh;

      align-items: center;
      justify-content: center;

      padding: 25px;

      text-align: center;
    }

    .error-card {
      max-width: 460px;
    }

    .error-icon {
      font-size: 50px;

      margin-bottom: 18px;
    }

    .error-card h1 {
      font-size: 30px;

      margin-bottom: 12px;
    }

    .error-card p {
      color: var(--muted);

      line-height: 1.6;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      header {
        height: 66px;

        padding: 0 18px;
      }

      main {
        padding:
          38px
          16px
          50px;
      }

      .business-name {
        font-size: 27px;
      }

      .business-logo,
      .business-logo-placeholder {
        width: 88px;
        height: 88px;

        border-radius: 24px;
      }

      .map-container {
        height: 260px;
      }

    }

  </style>
</head>


<body>


<!-- =========================
     LOADING
========================= -->

<div id="loading">

  <div class="loader"></div>

  <p>Cargando...</p>

</div>


<!-- =========================
     ERROR
========================= -->

<div id="error-page">

  <div class="error-card">

    <div class="error-icon">
      ⚠️
    </div>

    <h1>NFC no encontrado</h1>

    <p id="error-message">
      Esta tarjeta no está registrada o ya no se encuentra activa.
    </p>

  </div>

</div>


<!-- =========================
     APP
========================= -->

<div id="app">


  <!-- HEADER -->

  <header>

    <div class="clicktracker-brand">

      <div class="ct-icon">
        CT
      </div>

      <span>
        ClickTracker
      </span>

    </div>

  </header>


  <!-- MAIN -->

  <main>


    <!-- BUSINESS -->

    <section class="business-header">

      <div id="logo-container">

        <div class="business-logo-placeholder">
          •
        </div>

      </div>


      <h1
        class="business-name"
        id="business-name"
      >
        Cargando...
      </h1>


      <p
        class="business-description"
        id="business-description"
      >
      </p>

    </section>


    <!-- LINKS -->

    <section
      class="links"
      id="links-container"
    >
    </section>


    <!-- MAP -->

    <section
      class="map-section"
      id="map-section"
      style="display:none;"
    >

      <h2 class="map-title">
        📍 Encuéntranos aquí
      </h2>

      <div class="map-container">

        <iframe
          id="google-map"
          loading="lazy"
          allowfullscreen
        >
        </iframe>

      </div>

    </section>


    <!-- FOOTER -->

    <footer>

      <div class="powered">

        <span class="powered-icon">
          CT
        </span>

        <span>
          Powered by ClickTracker
        </span>

      </div>

    </footer>


  </main>

</div>



<!-- =========================
     JAVASCRIPT
========================= -->

<script type="module">

  import {
    createClient
  } from
  "https://esm.sh/@supabase/supabase-js@2";


  /* =========================
     SUPABASE
  ========================= */

  const SUPABASE_URL =
    "https://zrbujdpmrgeotubirxip.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_nH8fy-c0R_JQ_RHFpOY-kg_2gJW01mD";


  const supabase =
    createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* =========================
     ELEMENTOS
  ========================= */

  const loading =
    document.getElementById("loading");

  const app =
    document.getElementById("app");

  const errorPage =
    document.getElementById("error-page");

  const errorMessage =
    document.getElementById("error-message");

  const businessName =
    document.getElementById("business-name");

  const businessDescription =
    document.getElementById("business-description");

  const logoContainer =
    document.getElementById("logo-container");

  const linksContainer =
    document.getElementById("links-container");

  const mapSection =
    document.getElementById("map-section");

  const googleMap =
    document.getElementById("google-map");


  /* =========================
     OBTENER SLUG
  ========================= */

  const params =
    new URLSearchParams(
      window.location.search
    );

  let slug =
    params.get("slug");


  /*
    También permite:

    https://dominio.com/tanta-caja

    si en el futuro configuras
    rewrites en Vercel.
  */

  if (!slug) {

    const path =
      window.location.pathname
        .replace(/^\/+|\/+$/g, "");

    if (
      path &&
      path !== "index.html"
    ) {
      slug = path;
    }

  }


  /* =========================
     MOSTRAR ERROR
  ========================= */

  function showError(message) {

    loading.style.display =
      "none";

    app.style.display =
      "none";

    errorPage.style.display =
      "flex";

    errorMessage.textContent =
      message;

  }


  /* =========================
     CREAR BOTÓN
  ========================= */

  function createButton(
    icon,
    title,
    url,
    type = "normal"
  ) {

    if (
      !url ||
      url.trim() === ""
    ) {
      return;
    }


    const button =
      document.createElement("a");


    button.href =
      url;

    button.target =
      "_blank";

    button.rel =
      "noopener noreferrer";


    button.className =
      "link-button";


    if (
      type === "google"
    ) {
      button.classList.add(
        "google-review"
      );
    }


    button.innerHTML = `

      <div class="button-icon">
        ${icon}
      </div>

      <div class="button-content">
        ${title}
      </div>

      <div class="button-arrow">
        ›
      </div>

    `;


    /*
      Registrar click
    */

    button.addEventListener(
      "click",
      () => {

        registerClick(
          type,
          url
        );

      }
    );


    linksContainer.appendChild(
      button
    );

  }


  /* =========================
     REGISTRAR CLICK
  ========================= */

  async function registerClick(
    destination,
    url
  ) {

    try {

      await supabase
        .from("clicks")
        .insert({

          nfc_id:
            window.currentNfcId,

          business_id:
            window.currentBusinessId,

          destination:
            destination,

          url:
            url

        });

    }
    catch (error) {

      /*
        Si la estructura de tu tabla clicks
        es diferente, la página seguirá
        funcionando normalmente.
      */

      console.log(
        "No se pudo registrar el click:",
        error.message
      );

    }

  }


  /* =========================
     REGISTRAR VISITA
  ========================= */

  async function registerVisit() {

    try {

      await supabase
        .from("clicks")
        .insert({

          nfc_id:
            window.currentNfcId,

          business_id:
            window.currentBusinessId,

          destination:
            "visit"

        });

    }
    catch (error) {

      console.log(
        "No se pudo registrar la visita"
      );

    }

  }


  /* =========================
     CARGAR NFC
  ========================= */

  async function loadNfc() {


    /*
      Si no existe slug
    */

    if (!slug) {

      showError(
        "No se especificó ningún NFC en el enlace."
      );

      return;

    }


    try {


      /*
        Buscar NFC + negocio relacionado
      */

      const {
        data: nfc,
        error
      } =
      await supabase

        .from("nfc_devices")

        .select(`
          *,
          businesses (*)
        `)

        .eq(
          "slug",
          slug
        )

        .single();


      /*
        Error o NFC inexistente
      */

      if (
        error ||
        !nfc
      ) {

        console.log(error);

        showError(
          "Esta tarjeta no está registrada o el enlace no es correcto."
        );

        return;

      }


      /*
        Revisar estado.

        Compatible con:
        active
        is_active
      */

      if (
        nfc.active === false ||
        nfc.is_active === false
      ) {

        showError(
          "Esta tarjeta NFC se encuentra desactivada."
        );

        return;

      }


      /*
        Guardar IDs globalmente
        para tracking
      */

      window.currentNfcId =
        nfc.id;

      window.currentBusinessId =
        nfc.business_id;


      /*
        Negocio
      */

      const business =
        Array.isArray(nfc.businesses)
          ? nfc.businesses[0]
          : nfc.businesses;


      if (!business) {

        showError(
          "Este NFC no tiene ningún negocio asociado."
        );

        return;

      }


      console.log(
        "NFC encontrado:",
        nfc
      );

      console.log(
        "Negocio:",
        business
      );


      /* =========================
         NOMBRE
      ========================= */

      businessName.textContent =
        business.name ||
        business.business_name ||
        "Nuestro negocio";


      /* =========================
         DESCRIPCIÓN
      ========================= */

      const description =
        business.description ||
        business.bio ||
        "";

      businessDescription.textContent =
        description;


      /*
        Si no hay descripción,
        no ocupa espacio
      */

      if (!description) {

        businessDescription.style.display =
          "none";

      }


      /* =========================
         LOGO
      ========================= */

      const logoUrl =
        business.logo_url ||
        business.logo ||
        "";


      if (logoUrl) {

        logoContainer.innerHTML = `

          <img
            src="${logoUrl}"
            class="business-logo"
            alt="Logo del negocio"
          >

        `;

      }
      else {

        const firstLetter =
          (
            business.name ||
            business.business_name ||
            "C"
          )
          .charAt(0)
          .toUpperCase();


        logoContainer.innerHTML = `

          <div class="business-logo-placeholder">
            ${firstLetter}
          </div>

        `;

      }


      /* =========================
         URLS
      ========================= */


      /*
        GOOGLE REVIEWS
      */

      createButton(

        "⭐",

        "Déjanos una reseña en Google",

        business.google_review_url ||
        business.google_reviews_url ||
        business.google_url,

        "google"

      );


      /*
        INSTAGRAM
      */

      createButton(

        "📸",

        "Síguenos en Instagram",

        business.instagram_url ||
        business.instagram,

        "instagram"

      );


      /*
        FACEBOOK
      */

      createButton(

        "👍",

        "Síguenos en Facebook",

        business.facebook_url ||
        business.facebook,

        "facebook"

      );


      /*
        WHATSAPP
      */

      let whatsappUrl =
        business.whatsapp_url ||
        business.whatsapp ||
        "";


      /*
        Si guardas solamente
        el número de WhatsApp
      */

      if (
        whatsappUrl &&
        !whatsappUrl.startsWith("http")
      ) {

        whatsappUrl =
          "https://wa.me/" +
          whatsappUrl
            .replace(/\D/g, "");

      }


      createButton(

        "💬",

        "Escríbenos por WhatsApp",

        whatsappUrl,

        "whatsapp"

      );


      /*
        PÁGINA WEB
      */

      createButton(

        "🌐",

        "Visita nuestra página web",

        business.website_url ||
        business.website ||
        business.web_url,

        "website"

      );


      /* =========================
         MAPA
      ========================= */

      let mapsUrl =
        business.google_maps_url ||
        business.maps_url ||
        business.map_url ||
        "";


      /*
        Si existe URL de mapa
      */

      if (mapsUrl) {


        /*
          Si ya es embed URL
        */

        if (
          mapsUrl.includes(
            "google.com/maps/embed"
          )
        ) {

          googleMap.src =
            mapsUrl;

        }


        /*
          Si es URL normal de Google Maps
          se crea una búsqueda embebida
        */

        else {

          googleMap.src =
            "https://www.google.com/maps?q=" +
            encodeURIComponent(
              mapsUrl
            ) +
            "&output=embed";

        }


        mapSection.style.display =
          "block";

      }


      /* =========================
         MOSTRAR APP
      ========================= */

      loading.style.display =
        "none";

      app.style.display =
        "block";


      /*
        Registrar visita
      */

      registerVisit();


    }
    catch (error) {

      console.error(error);

      showError(
        "Ocurrió un error al cargar esta tarjeta NFC."
      );

    }

  }


  /* =========================
     INICIAR
  ========================= */

  loadNfc();

</script>


</body>
</html>
